# Builds the Marble Mayhem Android app.
# Move this file to  .github/workflows/android.yml  at the repository root.
# Repo layout expected:  build-web.py, index.html, web/, android-app/
#
# Outputs (Actions -> run -> Artifacts):
#   marble-mayhem-debug-apk   always; install directly on a phone (sideload)
#   marble-mayhem-release-aab only when the signing secrets exist; upload to Google Play
#
# Optional repository secrets (Settings -> Secrets and variables -> Actions):
#   MM_KEYSTORE_BASE64    base64 of the upload keystore (.jks)
#   MM_KEYSTORE_PASSWORD  keystore password
#   MM_KEY_ALIAS          key alias
#   MM_KEY_PASSWORD       key password
name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_SIGNING: ${{ secrets.MM_KEYSTORE_BASE64 != '' && secrets.MM_KEYSTORE_PASSWORD != '' && secrets.MM_KEY_ALIAS != '' && secrets.MM_KEY_PASSWORD != '' }}

    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: android-app/package-lock.json

      # Capacitor 8 / Android Gradle Plugin 8.13 compile with Java 21.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web game
        run: python3 build-web.py

      - name: Install npm packages
        working-directory: android-app
        run: npm ci

      - name: Copy web game into the Android project
        working-directory: android-app
        run: bash ./sync-web.sh

      - name: Build debug APK
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: marble-mayhem-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Decode upload keystore
        if: env.HAS_SIGNING == 'true'
        env:
          MM_KEYSTORE_BASE64: ${{ secrets.MM_KEYSTORE_BASE64 }}
        run: |
          echo "$MM_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload-keystore.jks"
          echo "MM_KEYSTORE=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release AAB
        if: env.HAS_SIGNING == 'true'
        working-directory: android-app/android
        env:
          MM_KEYSTORE_PASSWORD: ${{ secrets.MM_KEYSTORE_PASSWORD }}
          MM_KEY_ALIAS: ${{ secrets.MM_KEY_ALIAS }}
          MM_KEY_PASSWORD: ${{ secrets.MM_KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Upload release AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: marble-mayhem-release-aab
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always() && env.HAS_SIGNING == 'true'
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks"

      - name: Note when release signing is skipped
        if: env.HAS_SIGNING != 'true'
        run: echo "::notice::Signing secrets not set - built the debug APK only. See android-app/README.md to add them."
